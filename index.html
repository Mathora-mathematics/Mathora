<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf6fb">
  <title>Year 10 Mathematics | NES</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css?v=20260924-5">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Open lessons">☰</button>
    <div>
      <div class="eyebrow">NEW ENGLISH SCHOOL • YEAR 10</div>
      <h1 id="siteTitle">Mathematics Teaching Hub</h1>
    </div>
    <button id="presentBtn" class="ghost-btn">Presentation mode</button>
  </header>

  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Lesson navigation">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search lessons…" autocomplete="off">
      </div>
      <div id="lessonNav"><p class="empty">Loading lessons…</p></div>
    </aside>

    <main id="main" class="main">
      <section class="hero">
        <div>
          <span id="unitPill" class="pill">Year 10</span>
          <h2 id="lessonTitle">Choose a lesson</h2>
          <p id="lessonSubtitle"></p>
        </div>
        <div class="hero-actions">
          <button id="prevBtn" class="ghost-btn">← Previous</button>
          <button id="nextBtn" class="primary-btn">Next →</button>
        </div>
      </section>

      <nav class="tabs" aria-label="Lesson sections">
        <button class="tab active" data-tab="learn">Teach / key notes</button>
        <button class="tab" data-tab="examples">Teacher examples</button>
        <button class="tab" data-tab="practice">Independent practice</button>
        <button class="tab" data-tab="homework">Homework</button>
        <button class="tab" data-tab="whiteboard">Whiteboard</button>
      </nav>

      <section id="content" class="content"><article class="card" id="bootStatus"><h3>Loading Year 10 Mathematics…</h3><p>The lesson engine is starting.</p></article></section>
    </main>
  </div>

  <script>
    window.addEventListener("error", function (event) {
      var box = document.getElementById("content");
      if (!box) return;
      if (!box.innerHTML.trim()) {
        box.innerHTML = '<article class="card"><h3>Site startup error</h3><p>The lesson app could not initialise.</p><p style="font-family:monospace;font-size:.85rem;word-break:break-word">' +
          String(event.message || "Unknown JavaScript error") + '</p></article>';
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="lessons.js?v=20260924-5"></script>
  <script src="app-stable.js?v=20260924-5"></script>
  <noscript><div class="card" style="margin:20px"><strong>JavaScript is required for the interactive lesson website.</strong></div></noscript>\n</body>
</html>
