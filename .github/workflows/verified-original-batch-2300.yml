name: Verify private original maths batch 2026-11-01 2300
on:
  pull_request:
    paths:
      - 'content/operations/verified-original-batch-20261101-2300.json'
      - 'scripts/check-verified-batch-20261101-2300.mjs'
      - 'supabase/migrations/20261101_2300_cambridge_9231_board_gate.sql'
      - '.github/workflows/verified-original-batch-2300.yml'
  push:
    branches: ['main']
    paths:
      - 'content/operations/verified-original-batch-20261101-2300.json'
      - 'scripts/check-verified-batch-20261101-2300.mjs'
      - 'supabase/migrations/20261101_2300_cambridge_9231_board_gate.sql'
      - '.github/workflows/verified-original-batch-2300.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private batch ledger, privacy and board routing
        run: node scripts/check-verified-batch-20261101-2300.mjs
      - name: Regression checks for mathematical content, safe selection and examiner evidence
        run: |
          node scripts/check-original-practice.mjs
          node scripts/check-published-originals.mjs
          node scripts/check-approved-practice-gate.mjs
          node scripts/check-auto-assign.mjs
          node scripts/check-evidence-marking.mjs
          node scripts/test-all-tier-evidence.mjs
