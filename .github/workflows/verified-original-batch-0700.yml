name: Verify original IB maths batch 2026-11-01 0700
on:
  pull_request:
    paths:
      - 'content/operations/verified-original-batch-20261101-0700.json'
      - 'scripts/check-verified-batch-20261101-0700.mjs'
      - 'supabase/migrations/20261101_ib_board_alias_0700.sql'
      - '.github/workflows/verified-original-batch-0700.yml'
  push:
    branches: ['main']
    paths:
      - 'content/operations/verified-original-batch-20261101-0700.json'
      - 'scripts/check-verified-batch-20261101-0700.mjs'
      - 'supabase/migrations/20261101_ib_board_alias_0700.sql'
      - '.github/workflows/verified-original-batch-0700.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private IB batch metadata, maths and board routing
        run: node scripts/check-verified-batch-20261101-0700.mjs
      - name: Existing mathematics, marking, and anti-repeat regressions
        run: |
          node scripts/check-original-practice.mjs
          node scripts/check-published-originals.mjs
          node scripts/check-verified-batch-20261101-0300.mjs
          node scripts/check-verified-batch-20261101-0500.mjs
          node scripts/check-evidence-marking.mjs
          node scripts/test-all-tier-evidence.mjs
