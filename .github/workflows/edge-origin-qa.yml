name: MathsGrove Edge origin validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/invitations/index.ts'
      - 'supabase/functions/grove-student-export/index.ts'
      - 'scripts/check-edge-origins.mjs'
      - '.github/workflows/edge-origin-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current site origin and secure CORS
        run: |
          node scripts/check-edge-origins.mjs
          node scripts/check-student-export.mjs
          node --input-type=module --check < supabase/functions/invitations/index.ts
