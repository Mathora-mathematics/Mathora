name: Deploy Year 10 Maths site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate complete Year 10 build
        shell: bash
        run: |
          node --check lessons.js
          node --check content-core.js
          node --check content-12-17.js
          node --check content-18-22.js
          node --check app.js

          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}};
          vm.createContext(sandbox);
          for(const f of ['lessons.js','content-core.js','content-12-17.js','content-18-22.js']){
            vm.runInContext(fs.readFileSync(f,'utf8'),sandbox,{filename:f});
          }
          const lessons=sandbox.window.LESSONS;
          const content=sandbox.window.LESSON_CONTENT;
          if(!Array.isArray(lessons)||lessons.length!==47) throw new Error('Expected 47 lessons');
          if(new Set(lessons.map(x=>x.id)).size!==47) throw new Error('Duplicate lesson ids');
          if(Object.keys(content).length!==47) throw new Error('Expected 47 detailed content packs, got '+Object.keys(content).length);
          for(const l of lessons){
            const d=content[l.id];
            if(!d)throw new Error('Missing content '+l.id);
            if(!d.explain||d.explain.length<40)throw new Error('Weak explanation '+l.id);
            if(!Array.isArray(d.keyPoints)||d.keyPoints.length<3)throw new Error('Missing key points '+l.id);
            if(!Array.isArray(d.method)||d.method.length<3)throw new Error('Missing method '+l.id);
            if(!Array.isArray(d.examples)||d.examples.length<2)throw new Error('Need >=2 examples '+l.id);
            for(const k of ['foundation','core','extension','reasoning']){
              if(!d.practice||!Array.isArray(d.practice[k])||d.practice[k].length<2)throw new Error('Weak practice '+l.id+' '+k);
            }
            if(!Array.isArray(d.homework)||d.homework.length<4)throw new Error('Need >=4 homework '+l.id);
            if(!d.cambridge||!d.examSuccess)throw new Error('Missing source alignment '+l.id);
          }
          const html=fs.readFileSync('index.html','utf8');
          for(const f of ['lessons.js','content-core.js','content-12-17.js','content-18-22.js','app.js']){
            if(!html.includes(f))throw new Error('index missing '+f);
          }
          if(html.includes('app-stable.js')||html.includes('app-v6.js'))throw new Error('obsolete runtime referenced');
          console.log('PASS: 47/47 lessons contain full teaching packs.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
