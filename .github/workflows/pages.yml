name: Deploy lesson design prototype to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate design prototype
        shell: bash
        run: |
          node --check app.js
          grep -q 'notebook' index.html
          grep -q 'reveal-button' index.html
          grep -q 'graph-paper' index.html
          grep -q 'flow-nav' index.html
          grep -q 'styles.css?v=design-20260924' index.html
          grep -q 'app.js?v=design-20260924' index.html
          echo "PASS: lesson design prototype is structurally complete."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
