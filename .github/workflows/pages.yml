name: Deploy NES lesson design prototype

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate design
        shell: bash
        run: |
          node --check app.js
          grep -q 'Title + starter' index.html
          grep -q 'homework-page' index.html
          grep -q 'cover-logo' index.html
          grep -q 'nes-design-2' index.html
          grep -q 'app.js?v=nes-design-2' index.html
          echo "PASS: NES design prototype validated."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
