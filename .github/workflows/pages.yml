name: Deploy MathsGrove website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check app JavaScript and website integrity
        run: |
          node --check marketing.js
          node --check whiteboard.js
          node --check sample.js
          node --input-type=module --check < portal.js
          node --input-type=module --check < studio.js
          node --input-type=module --check < supabase/functions/invitations/index.ts
          node scripts/check-site.mjs
      - name: Assemble only MathsGrove public assets
        shell: bash
        run: |
          mkdir -p site
          cp index.html mathsgrove.css brand-refresh.css marketing-services.css marketing.js mathsgrove-icon.svg site/
          cp portal.html portal.css private-refresh.css student-features.css portal.js mathsgrove-config.js whiteboard.js site/
          cp studio.html studio.css studio.js site/
          cp sample.html sample.css sample.js site/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4