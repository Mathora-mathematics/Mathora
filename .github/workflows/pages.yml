name: Deploy NES Year 10 Mathematics site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate lesson site
        shell: bash
        run: |
          node --check lessons.js
          node --check sow-map.js
          node --check content-core.js
          node --check content-12-17.js
          node --check content-18-22.js
          node --check starters.js
          node --check starter-answers.js
          node --check enhancements.js
          node --check diagrams.js
          node --check book-diagrams.js
          node --check question-diagrams.js
          node --check question-engine.js
          node --check app.js

          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const sandbox={window:{}};
          vm.createContext(sandbox);
          for(const f of [
            'lessons.js','sow-map.js','content-core.js','content-12-17.js','content-18-22.js',
            'starters.js','starter-answers.js','enhancements.js','diagrams.js','book-diagrams.js',
            'question-diagrams.js','question-engine.js'
          ]){
            vm.runInContext(fs.readFileSync(f,'utf8'),sandbox,{filename:f});
          }

          const lessons=sandbox.window.LESSONS;
          const content=sandbox.window.LESSON_CONTENT;
          const starters=sandbox.window.STARTERS;
          const answers=sandbox.window.STARTER_ANSWERS;
          const sow=sandbox.window.SOW_MAP;
          const extra=sandbox.window.EXTRA_EXAMPLES;
          const diagrams=sandbox.window.MathoraDiagrams;
          const engine=sandbox.window.MathoraQuestionEngine;

          if(!Array.isArray(lessons)||lessons.length!==47) throw new Error('Expected 47 SoW lessons');
          if(Object.keys(content).length!==47) throw new Error('Expected 47 lesson content packs');
          if(Object.keys(starters).length!==47) throw new Error('Expected 47 starter sets');
          if(Object.keys(answers).length!==47) throw new Error('Expected 47 starter-answer sets');
          if(Object.keys(sow).length!==47) throw new Error('Expected 47 exact SoW mappings');
          if(Object.keys(extra).length!==47) throw new Error('Expected 47 enhanced example sets');
          if(!engine||typeof engine.build!=='function') throw new Error('Question engine missing');
          if(!diagrams||typeof diagrams.question!=='function') throw new Error('Question diagram renderer missing');

          for(const l of lessons){
            const d=content[l.id];
            if(!d) throw new Error('Missing content for '+l.id);
            if(!Array.isArray(starters[l.id])||starters[l.id].length!==4) throw new Error('Starter count wrong for '+l.id);
            if(!Array.isArray(answers[l.id])||answers[l.id].length!==4) throw new Error('Starter answers wrong for '+l.id);
            if(!Array.isArray(d.examples)||d.examples.length<3) throw new Error('Need base teacher examples for '+l.id);
            if(!Array.isArray(extra[l.id])||extra[l.id].length<2) throw new Error('Need two extra examples for '+l.id);

            const bank=engine.build(l.type);
            if(!bank||bank.practice.length!==16||bank.homework.length!==16){
              throw new Error('Need 16 practice + 16 homework for '+l.id);
            }
            for(const [kind,items] of Object.entries(bank)){
              for(let i=0;i<items.length;i++){
                const q=items[i];
                if(!q.prompt||!Array.isArray(q.steps)||q.steps.length<1) throw new Error('Missing solved question '+l.id+' '+kind+' '+i);
                if(q.diagram){
                  const svg=diagrams.question(q.diagram);
                  if(typeof svg!=='string'||!svg.includes('<svg')) throw new Error('Broken diagram '+l.id+' '+kind+' '+i+' '+q.diagram.kind);
                }
              }
            }

            for(let i=0;i<5;i++){
              const svg=diagrams.example(l.id,l.type,i);
              if(typeof svg!=='string'||!svg.includes('<svg')) throw new Error('Broken teacher diagram '+l.id+' example '+(i+1));
            }
          }

          const html=fs.readFileSync('index.html','utf8');
          for(const f of [
            'lessons.js','sow-map.js','content-core.js','content-12-17.js','content-18-22.js',
            'starters.js','starter-answers.js','enhancements.js','diagrams.js','book-diagrams.js',
            'question-diagrams.js','question-engine.js','app.js'
          ]){
            if(!html.includes(f)) throw new Error('index.html missing '+f);
          }

          console.log('PASS: 47 lessons; 5 examples each; 16 practice + 16 homework; all solved diagrams validated.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
