name: Deploy MathsGrove website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check app JavaScript and website integrity
        run: |
          node --check marketing.js
          node --check whiteboard.js
          node --check sample.js
          node --check sample-extras.js
          node --check maths-render.js
          node --input-type=module --check < baseline.js
          node --input-type=module --check < baseline-calc.js
          node --input-type=module --check < baseline-admin.js
          node --input-type=module --check < access-router.js
          node --input-type=module --check < portal.js
          node --input-type=module --check < studio.js
          node --input-type=module --check < access-management.js
          node --input-type=module --check < family-access.js
          node --check showcase-v3.js
          node --check experience-v4.js
          node --input-type=module --check < content-bank.js
          node --input-type=module --check < supabase/functions/invitations/index.ts
          node scripts/check-site.mjs
          node scripts/check-family-access.mjs
          node scripts/test-access-router.mjs
          node scripts/check-baseline.mjs
          node scripts/check-baseline-seeds.mjs
          node scripts/check-content.mjs
          node scripts/check-original-practice.mjs
      - name: Assemble only MathsGrove public assets
        shell: bash
        run: |
          mkdir -p site
          cp index.html mathsgrove.css brand-refresh.css marketing-services.css marketing.js mathsgrove-icon.svg showcase-v3.css showcase-v3.js experience-v4.css experience-v4.js site/
          cp portal.html portal.css private-refresh.css student-features.css evidence-theme.css timed-mock.css maths-notation.css portal.js maths-render.js mathsgrove-config.js whiteboard.js site/
          cp baseline.html baseline.css baseline.js baseline-calc.js site/
          cp studio.html studio.css studio.js admin-learner.css content-bank.js content-bank.css timed-mock.css maths-notation.css access-management.css access-management.js access-router.js baseline-admin.js site/
          cp family.html family-access.css family-access.js site/
          mkdir -p site/content
          cp content/boards.json content/paper-blueprints.json site/content/
          mkdir -p site/content/programmes
          cp content/programmes/service-tiers.json content/programmes/draft-questions.json content/programmes/practice-gcse-v2.json content/programmes/practice-igcse-v2.json content/programmes/practice-foundation-core-v2.json site/content/programmes/
          cp content/programmes/extra-practice-120.json content/programmes/exam-reasoning-drafts-12.json site/content/programmes/
          cp content/programmes/original-question-bank-144.json site/content/programmes/
          mkdir -p site/content/GCSE site/content/IGCSE
          cp content/GCSE/draft-exemplars.json site/content/GCSE/
          cp content/IGCSE/draft-exemplars.json site/content/IGCSE/
          cp sample.html sample.css sample-extras.css sample.js sample-extras.js site/
          cp journey.html journey.css journey.js embed-bridge.js unified-site.js site/
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4