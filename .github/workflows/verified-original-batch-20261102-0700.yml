name: Verify private original maths batch 2026-11-02 0700
on:
  pull_request:
    paths:
      - 'content/operations/verified-original-batch-20261102-0700.json'
      - 'scripts/check-verified-batch-20261102-0700.mjs'
      - 'supabase/migrations/20261102_0700_9fm0_4b_option_guard.sql'
      - '.github/workflows/verified-original-batch-20261102-0700.yml'
  push:
    branches: ['main']
    paths:
      - 'content/operations/verified-original-batch-20261102-0700.json'
      - 'scripts/check-verified-batch-20261102-0700.mjs'
      - 'supabase/migrations/20261102_0700_9fm0_4b_option_guard.sql'
      - '.github/workflows/verified-original-batch-20261102-0700.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check private-batch metadata, routing and privacy
        run: node scripts/check-verified-batch-20261102-0700.mjs
      - name: Regression for selection, human marking and evidence
        run: |
          node scripts/check-original-practice.mjs
          node scripts/check-published-originals.mjs
          node scripts/check-approved-practice-gate.mjs
          node scripts/check-auto-assign.mjs
          node scripts/check-evidence-marking.mjs
          node scripts/test-all-tier-evidence.mjs
