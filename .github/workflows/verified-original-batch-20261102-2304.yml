name: Verify MathsGrove original content batch 2026-11-02 2304
on:
  pull_request:
    paths:
      - 'content/operations/verified-original-batch-20261102-2304.json'
      - 'content/operations/2026-11-02-2304-kwt-mechanics-further-content-qa.md'
      - 'scripts/check-verified-batch-20261102-2304.mjs'
      - '.github/workflows/verified-original-batch-20261102-2304.yml'
  push:
    branches: ['main']
    paths:
      - 'content/operations/verified-original-batch-20261102-2304.json'
      - 'content/operations/2026-11-02-2304-kwt-mechanics-further-content-qa.md'
      - 'scripts/check-verified-batch-20261102-2304.mjs'
      - '.github/workflows/verified-original-batch-20261102-2304.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original mathematics and private Signature moderation boundary
        run: node scripts/check-verified-batch-20261102-2304.mjs
      - name: Learner no-repeat, qualification routing, evidence and human-marking regression
        run: |
          node scripts/check-original-practice.mjs
          node scripts/check-published-originals.mjs
          node scripts/check-approved-practice-gate.mjs
          node scripts/check-auto-assign.mjs
          node scripts/check-evidence-marking.mjs
          node scripts/test-all-tier-evidence.mjs
          node scripts/check-signature-editorial.mjs
