name: Verify original maths batch 2026-11-01 0500
on:
  pull_request:
    paths:
      - 'content/operations/verified-original-batch-20261101-0500.json'
      - 'scripts/check-verified-batch-20261101-0500.mjs'
      - 'supabase/migrations/20261101_strict_alevel_board_route.sql'
      - '.github/workflows/verified-original-batch-0500.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: ['main']
    paths:
      - 'content/operations/verified-original-batch-20261101-0500.json'
      - 'scripts/check-verified-batch-20261101-0500.mjs'
      - 'supabase/migrations/20261101_strict_alevel_board_route.sql'
      - '.github/workflows/verified-original-batch-0500.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metadata-only batch and strict A-level route guard
        run: node scripts/check-verified-batch-20261101-0500.mjs
      - name: Existing mathematics and no-repeat regressions
        run: |
          node scripts/check-published-originals.mjs
          node scripts/check-verified-batch-20261101-0300.mjs
          node scripts/check-original-practice.mjs
