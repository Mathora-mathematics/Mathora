name: Verify MathsGrove original content batch 2026-11-02 1709
on:
  pull_request:
    paths:
      - 'content/operations/verified-original-batch-20261102-1709.json'
      - 'content/operations/2026-11-02-1709-kwt-4ma1-aqa-9231-content-qa.md'
      - 'scripts/check-verified-batch-20261102-1709.mjs'
      - '.github/workflows/verified-original-batch-20261102-1709.yml'
  push:
    branches: ['main']
    paths:
      - 'content/operations/verified-original-batch-20261102-1709.json'
      - 'content/operations/2026-11-02-1709-kwt-4ma1-aqa-9231-content-qa.md'
      - 'scripts/check-verified-batch-20261102-1709.mjs'
      - '.github/workflows/verified-original-batch-20261102-1709.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent 17:09 mathematical and privacy-safe ledger checks
        run: node scripts/check-verified-batch-20261102-1709.mjs
      - name: Student routing, no-repeat, evidence and examiner marking regression
        run: |
          node scripts/check-original-practice.mjs
          node scripts/check-published-originals.mjs
          node scripts/check-approved-practice-gate.mjs
          node scripts/check-auto-assign.mjs
          node scripts/check-evidence-marking.mjs
          node scripts/test-all-tier-evidence.mjs
