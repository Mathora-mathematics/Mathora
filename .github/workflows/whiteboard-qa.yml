name: MathsGrove whiteboard and portal QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'whiteboard.js'
      - 'evidence-workspace.js'
      - 'evidence-workspace.css'
      - 'assigned-practice.js'
      - 'studio.js'
      - 'scripts/check-whiteboard-v2.mjs'
      - '.github/workflows/whiteboard-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-logic:
    name: Validate whiteboard and connected portal modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check whiteboard.js
          node --input-type=module --check < evidence-workspace.js
          node --input-type=module --check < assigned-practice.js
          node --input-type=module --check < studio.js
      - name: Test whiteboard behaviour
        run: node scripts/check-whiteboard-v2.mjs
